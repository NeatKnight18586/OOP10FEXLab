name: Build Windows Forms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HeavensKarinderya/HeavensKarinderya.csproj
      - name: Build
        run: dotnet build HeavensKarinderya/HeavensKarinderya.csproj -c Release --no-restore
